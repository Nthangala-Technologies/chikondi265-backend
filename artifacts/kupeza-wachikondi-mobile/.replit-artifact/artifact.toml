kind = "mobile"
previewPath = "/"
title = "CHIKONDI265"
description = "A native dating app for Malawi with profiles, discovery, connections, safety features, and private chat."
version = "1.0.0"
id = "artifacts/kupeza-wachikondi-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20802

[services.development]
run = "pnpm --filter @workspace/kupeza-wachikondi-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kupeza-wachikondi-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kupeza-wachikondi-mobile", "run", "serve" ]

[services.env]
PORT = "20802"
BASE_PATH = "/"
